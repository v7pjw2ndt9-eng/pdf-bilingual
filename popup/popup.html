<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 268px; margin: 0; padding: 12px;
         font: 13px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; }
  h3 { margin: 0 0 10px; font-size: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  select { flex: 1; padding: 4px 6px; border-radius: 5px; border: 1px solid #c8c8d2;
           background: Field; color: FieldText; font: inherit; }
  button { width: 100%; padding: 7px; border-radius: 6px; border: 1px solid #c8c8d2;
           background: ButtonFace; color: ButtonText; cursor: pointer; font: inherit; margin-top: 4px; }
  button.primary { background: #3584e4; color: #fff; border-color: #3584e4; }
  label.chk { display: flex; align-items: center; gap: 6px; }
  .muted { color: #86868f; font-size: 12px; margin: 10px 0 0; }
</style>
</head>
<body>
<h3>PDF 双语阅读器</h3>

<div class="row">
  <span>后端</span>
  <select id="provider">
    <option value="bridge">本地桥接（订阅）</option>
    <option value="anthropic">Claude API</option>
    <option value="openai">GPT API</option>
    <option value="google">Google 免费</option>
  </select>
</div>

<div class="row">
  <span>排版</span>
  <select id="layout">
    <option value="insert">插入</option>
    <option value="side">分栏</option>
    <option value="hover">悬停</option>
  </select>
</div>

<div class="row"><label class="chk"><input type="checkbox" id="interceptPdf"> 自动接管 PDF 链接</label></div>
<div class="row"><label class="chk"><input type="checkbox" id="autoTranslate"> 打开即翻译</label></div>

<button class="primary" id="openHere">用双语阅读器打开当前页</button>
<button id="openBlank">打开本地 PDF</button>
<button id="opts">设置…</button>

<p class="muted" id="tip"></p>

<script type="module" src="popup.js"></script>
</body>
</html>
